<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><meta name="theme-color" content="#f8f3ed"><title>Кому чего</title><style>
:root{--ink:#493b39;--rose:#a26470;--muted:#887673;--line:#eaded7;--paper:#fffdf9}*{box-sizing:border-box}body{margin:0;background:#f8f3ed;color:var(--ink);font:15px/1.5 system-ui,-apple-system,sans-serif}main{max-width:640px;margin:auto;padding:max(24px,env(safe-area-inset-top)) 18px 115px}h1,h2,h3{font-family:Georgia,'Times New Roman',serif;font-weight:400}h1{font-size:36px;letter-spacing:-1.4px;margin:0}h2{font-size:26px;margin:22px 0 12px}h3{font-size:21px;margin:0 0 4px}small{color:var(--muted)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:var(--rose);color:white}button:active{opacity:.75}input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink)}label{display:block;font-size:12px;margin:12px 0 5px;color:var(--muted)}.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 4px 18px #75534808}.stats{display:flex;gap:12px}.stats>div{flex:1;padding:0 8px}.stats>div+div{border-left:1px solid var(--line);padding-left:20px}.stats b{display:block;font:24px Georgia,serif;margin-top:3px}.summary{background:#f1e3e0;border-color:#ead5d0}.summary p{font-size:12px;color:var(--muted);margin:12px 8px}.summary button{font-weight:500}nav{position:fixed;bottom:0;left:0;right:0;background:#fffdf9f5;backdrop-filter:blur(16px);display:flex;justify-content:center;padding:7px 5px max(8px,env(safe-area-inset-bottom));border-top:1px solid var(--line)}nav button{background:transparent;color:var(--muted);font-size:11px;flex:1;max-width:128px;padding:8px 2px;display:grid;justify-items:center;gap:4px}nav button.active{background:#f3e5e3;color:#955864}nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.line{display:flex;gap:8px;align-items:center;justify-content:space-between}.muted{background:#f3e7e3;color:#865660}.danger{background:transparent;color:#a26470}a{color:#925963}dialog{border:1px solid var(--line);border-radius:24px;background:var(--paper);color:var(--ink);width:min(94%,500px);max-height:88vh;overflow:auto;padding:22px}dialog::backdrop{background:#493b3966}img{max-width:100%;max-height:200px;border-radius:14px;object-fit:cover}p{margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}.gift-head{display:flex;gap:14px;align-items:center}.gift-head img,.gift-placeholder{width:76px;height:76px;flex-shrink:0;border-radius:14px;object-fit:cover}.gift-placeholder{display:grid;place-items:center;background:#f1e3e0;color:#a26470;font-size:30px}.gift-info{flex:1;min-width:0}.gift-info h3{overflow-wrap:anywhere}.gift-price{font:20px Georgia,serif;white-space:nowrap}.status-pill{display:inline-block;border:1px solid #e5d1cb;border-radius:30px;padding:3px 9px;font-size:11px;color:#925963;margin-top:6px}.gift-actions{border-top:1px solid var(--line);padding-top:9px;margin-top:12px}.gift-actions button{font-size:12px;padding:7px 12px}.subtitle{display:block;letter-spacing:1.6px;text-transform:uppercase;font-size:10px;margin-top:4px}#sync{font-size:11px;display:block;margin-top:8px;color:#887673}#login{margin:10px 0}#login[hidden]{display:none}.empty{text-align:center;padding:28px;color:var(--muted)}.empty h3{color:var(--ink)}
</style><main><div class="line"><h1>Кому чего</h1><button class="muted" onclick="settings.showModal()" aria-label="Настройки">⚙</button></div><small id="sync">Не подключено</small><p id="login"><button onclick="connect()">Подключить таблицу</button></p><small class="subtitle">Подарки с заботой</small><div id="view"></div></main><nav id="nav"></nav><dialog id="dlg"><form id="form"><h2>Подарок</h2><label>Название</label><input name="title" required><label>Кому</label><input name="person" placeholder="Можно оставить пустым"><label>Категория</label><input name="category" list="cats" placeholder="Выбрать или написать свою"><datalist id="cats"><option>Родные и близкие</option><option>Друзья</option><option>Коллеги</option><option>Руководство</option></datalist><label>Повод</label><input name="occasion" placeholder="Новый год, день рождения…"><label>Дата праздника</label><input name="date" type="date"><label>Плановая цена, ₽</label><input name="price" type="number" min="0" step="0.01"><label>Фактическая цена, ₽</label><input name="actual" type="number" min="0" step="0.01"><label>Статус</label><select name="status"><option>Идея</option><option>Запланирован</option><option>Заказан</option><option>Куплен</option><option>Подарен</option></select><label>Ссылка на магазин</label><input name="url" type="url"><label>Ссылка на фото</label><input name="photo" type="url"><label>Заметки</label><textarea name="note"></textarea><p class="line"><button type="button" class="muted" onclick="dlg.close()">Отмена</button><button>Сохранить</button></p></form></dialog><dialog id="settings"><h2>Настройки</h2><p><button onclick="connect()">Настроить подключение</button></p><p><button class="muted" onclick="load()">Обновить данные</button></p><p><button class="muted" onclick="backup()">Экспорт</button> <button class="muted" onclick="document.getElementById('import').click()">Импорт</button></p><input hidden type="file" id="import" accept=".json" onchange="restore(this)"><p><button class="muted" onclick="settings.close()">Закрыть</button></p></dialog><script>
const $=id=>document.getElementById(id),dlg=$('dlg'),form=$('form');let data=[], baseline=[], token=localStorage.getItem('gifts-key')||'', busy=false, ready=false;const settings=$('settings');
const KEYS=['id','title','person','category','occasion','date','price','actual','status','url','photo','note'];
const HEAD=['ID','Название','Кому','Категория','Повод','Дата','План','Факт','Статус','Ссылка','Фото','Заметки'];
const api='https://script.google.com/macros/s/AKfycbz9-n5Z6jbZ2i_slfpzdHYlZMnon2BVQzyRhmmHxyCu3P0_Wu6u5bf5Q5dMdupKzs9N/exec';
let revision='';
function status(t){$('sync').textContent=t;}
function connect(){if(busy)return;const k=prompt('Введите секретный ключ из журнала Apps Script',token);if(!k)return;token=k.trim();localStorage.setItem('gifts-key',token);load()}
async function request(action,extra={}){const r=await fetch(api,{method:'POST',body:JSON.stringify({action,key:token,...extra}),credentials:'omit',redirect:'follow'});const j=await r.json();if(!j.ok)throw Error(j.error||'Ошибка сервера');return j;}
async function load(){if(busy)return;if(!token){status('Подключите таблицу');return}busy=true;ready=false;status('Загрузка…');try{const r=await request('load');data=r.data;revision=r.revision;ready=true;$('login').hidden=true;status('● Синхронизировано');render()}catch(e){$('login').hidden=false;status('Ошибка: '+e.message)}finally{busy=false}}
let tab=0,editing=null,query='';const tabs=['Главная','Люди','Идеи','Покупки','Бюджет'];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const safe=s=>/^https?:\/\//i.test(s||'')?esc(s):'';const money=n=>Number(n||0).toLocaleString('ru-RU')+' ₽';async function save(){busy=true;status('Сохранение…');try{const r=await request('save',{data,revision});revision=r.revision;status('● Сохранено')}catch(e){status('Не сохранено: '+e.message);alert('Изменения не подтверждены. Экспортируйте копию в настройках перед обновлением.')}finally{busy=false;render()}}function edit(id){if(!ready||busy){status("Сначала подключите Google и дождитесь загрузки");return}editing=id;form.reset();let d=data.find(x=>x.id===id);if(d)for(let k of Object.keys(d))if(form.elements.namedItem(k))form.elements.namedItem(k).value=d[k];dlg.showModal()}form.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(form));d.id=editing||crypto.randomUUID();data=data.filter(x=>x.id!==d.id).concat(d);dlg.close();save()};function removeGift(id){if(!ready||busy)return;if(confirm('Удалить подарок?')){data=data.filter(x=>x.id!==id);save()}}function go(i){tab=i;query='';render()}function search(q){query=q;renderList()}function cards(a){return a.map(d=>`<article class="card"><div class="gift-head">${safe(d.photo)?`<img src="${safe(d.photo)}" alt="Фото подарка">`:'<div class="gift-placeholder">♡</div>'}<div class="gift-info"><small>${esc(d.person||'Без получателя')} · ${esc(d.category||'Без категории')}</small><h3>${esc(d.title)}</h3><span class="status-pill">${esc(d.status)}</span></div><span class="gift-price">${money(d.price)}</span></div>${d.occasion||d.date?`<p><small>${esc(d.occasion)} ${esc(d.date)}</small></p>`:''}${d.note?`<p>${esc(d.note)}</p>`:''}${safe(d.url)?`<p><a href="${safe(d.url)}" target="_blank" rel="noopener">Открыть магазин ↗</a></p>`:''}<div class="line gift-actions"><button class="muted" onclick="edit('${esc(d.id).replace(/[^a-zA-Z0-9-]/g,'')}')">Изменить</button><button class="danger" onclick="removeGift('${esc(d.id).replace(/[^a-zA-Z0-9-]/g,'')}')">Удалить</button></div></article>`).join('')||'<div class="card empty"><h3>Пока нет подарков</h3>Здесь будут ваши маленькие радости.</div>'}function renderList(){let a=data.filter(d=>Object.values(d).join(' ').toLowerCase().includes(query.toLowerCase()));if(tab===2)a=a.filter(d=>d.status==='Идея');if(tab===3)a=a.filter(d=>['Запланирован','Заказан','Куплен'].includes(d.status));if(tab===1){let groups={};a.forEach(d=>{let k=(d.category||'Без категории')+' / '+(d.person||'Без получателя');(groups[k]??=[]).push(d)});$('list').innerHTML=Object.entries(groups).map(([k,v])=>`<h3>${esc(k)}</h3>${cards(v)}`).join('')||cards([])}else $('list').innerHTML=cards(a)}function render(){ $('nav').innerHTML=tabs.map((t,i)=>`<button class="${i===tab?'active':''}" onclick="go(${i})">${["<svg viewBox=\"0 0 24 24\"><path d=\"M3 10 12 3l9 7v11H3z M9 21v-8h6v8\"/></svg>", "<svg viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"7\" r=\"4\"/><path d=\"M4 21v-2a8 8 0 0 1 16 0v2\"/></svg>", "<svg viewBox=\"0 0 24 24\"><path d=\"m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2-5.5-3-5.5 3 1-6.2L3 9.6l6.2-.9z\"/></svg>", "<svg viewBox=\"0 0 24 24\"><path d=\"M4 8h16l1 13H3z M8 9V6a4 4 0 0 1 8 0v3\"/></svg>", "<svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"15\" rx=\"3\"/><path d=\"M3 10h18 M16 15h2\"/></svg>"][i]}${t}</button>`).join('');let plan=data.reduce((s,d)=>s+Number(d.price||0),0),actual=data.reduce((s,d)=>s+Number(d.actual||0),0);$('view').innerHTML=`<div class="card summary"><div class="stats"><div><small>План</small><b>${money(plan)}</b></div><div><small>Потрачено</small><b>${money(actual)}</b></div></div><p>${data.filter(d=>['Куплен','Подарен'].includes(d.status)).length} из ${data.length} подарков готовы</p><button style="width:100%" onclick="edit(null)">＋ Добавить подарок</button></div>${tab===4?'<div class="card"><h3>Бюджет по категориям</h3>'+[...new Set(data.map(d=>d.category||'Без категории'))].map(k=>`<p>${esc(k)} — ${money(data.filter(d=>(d.category||'Без категории')===k).reduce((s,d)=>s+Number(d.price||0),0))}</p>`).join('')+'</div>':''}<div class="line"><h2>${tabs[tab]}</h2></div><input placeholder="Поиск подарков и людей" oninput="search(this.value)" value="${esc(query)}"><div id="list"></div>`;renderList()}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='gifts-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restore(el){if(!ready||busy)return;try{let a=JSON.parse(await el.files[0].text());if(!Array.isArray(a)||!a.every(d=>d&&typeof d.title==='string'))throw Error();if(confirm('Заменить текущий список данными из копии?')){data=a.map((d,i)=>({...d,id:Date.now().toString(36)+i}));save()}}catch{alert('Не удалось прочитать копию')}}render();load();if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});</script></html>
