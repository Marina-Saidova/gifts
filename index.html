<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><meta name="theme-color" content="#f5f2ed"><title>Кому чего</title><style>*{box-sizing:border-box}body{font:16px system-ui;background:#f5f2ed;color:#243b32;margin:0}main{max-width:650px;margin:auto;padding: max(20px,env(safe-area-inset-top)) 16px 120px}h1{font-size:29px;margin:0}small{color:#68776d}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px;background:#35634e;color:white}input,select,textarea{width:100%;padding:12px;border:1px solid #d8ded5;border-radius:10px;background:white;color:#243b32}label{display:block;font-size:13px;margin:10px 0 4px}.card{background:white;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #00000008}.stats{display:flex;gap:10px}.stats>div{flex:1;background:#e5ebe1;border-radius:14px;padding:14px}.stats b{display:block;font-size:23px;margin-top:5px}nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:center;padding:8px 4px max(8px,env(safe-area-inset-bottom));border-top:1px solid #ddd}nav button{background:white;color:#35634e;font-size:12px;flex:1;max-width:130px}nav button.active{background:#e5ebe1}.line{display:flex;gap:8px;align-items:center;justify-content:space-between}.muted{background:#e5ebe1;color:#35634e}.danger{background:#f7e8e4;color:#963e32}a{color:#35634e}dialog{border:0;border-radius:20px;width:min(94%,500px);max-height:90vh;overflow:auto}dialog::backdrop{background:#0006}img{max-width:100%;max-height:160px;border-radius:12px}h3{margin:0 0 8px}p{margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}</style><main><div class="line"><h1>Кому чего 🎁</h1><button class="muted" onclick="settings.showModal()" aria-label="Настройки">⚙</button></div><small id="sync">Не подключено</small><p id="login"><button onclick="connect()">Подключить таблицу</button></p><small>Подарки с заботой</small><div id="view"></div></main><nav id="nav"></nav><dialog id="dlg"><form id="form"><h2>Подарок</h2><label>Название</label><input name="title" required><label>Кому</label><input name="person" placeholder="Можно оставить пустым"><label>Категория</label><input name="category" list="cats" placeholder="Выбрать или написать свою"><datalist id="cats"><option>Родные и близкие</option><option>Друзья</option><option>Коллеги</option><option>Руководство</option></datalist><label>Повод</label><input name="occasion" placeholder="Новый год, день рождения…"><label>Дата праздника</label><input name="date" type="date"><label>Плановая цена, ₽</label><input name="price" type="number" min="0" step="0.01"><label>Фактическая цена, ₽</label><input name="actual" type="number" min="0" step="0.01"><label>Статус</label><select name="status"><option>Идея</option><option>Запланирован</option><option>Заказан</option><option>Куплен</option><option>Подарен</option></select><label>Ссылка на магазин</label><input name="url" type="url"><label>Ссылка на фото</label><input name="photo" type="url"><label>Заметки</label><textarea name="note"></textarea><p class="line"><button type="button" class="muted" onclick="dlg.close()">Отмена</button><button>Сохранить</button></p></form></dialog><dialog id="settings"><h2>Настройки</h2><p><button onclick="connect()">Настроить подключение</button></p><p><button class="muted" onclick="load()">Обновить данные</button></p><p><button class="muted" onclick="backup()">Экспорт</button> <button class="muted" onclick="document.getElementById('import').click()">Импорт</button></p><input hidden type="file" id="import" accept=".json" onchange="restore(this)"><p><button class="muted" onclick="settings.close()">Закрыть</button></p></dialog><script>
const $=id=>document.getElementById(id),dlg=$('dlg'),form=$('form');let data=[], baseline=[], token=localStorage.getItem('gifts-key')||'', busy=false, ready=false;const settings=$('settings');
const KEYS=['id','title','person','category','occasion','date','price','actual','status','url','photo','note'];
const HEAD=['ID','Название','Кому','Категория','Повод','Дата','План','Факт','Статус','Ссылка','Фото','Заметки'];
const api='https://script.google.com/macros/s/AKfycbz9-n5Z6jbZ2i_slfpzdHYlZMnon2BVQzyRhmmHxyCu3P0_Wu6u5bf5Q5dMdupKzs9N/exec';
let revision='';
function status(t){$('sync').textContent=t;}
function connect(){if(busy)return;const k=prompt('Введите секретный ключ из журнала Apps Script',token);if(!k)return;token=k.trim();localStorage.setItem('gifts-key',token);load()}
async function request(action,extra={}){const r=await fetch(api,{method:'POST',body:JSON.stringify({action,key:token,...extra}),credentials:'omit',redirect:'follow'});const j=await r.json();if(!j.ok)throw Error(j.error||'Ошибка сервера');return j;}
async function load(){if(busy)return;if(!token){status('Подключите таблицу');return}busy=true;ready=false;status('Загрузка…');try{const r=await request('load');data=r.data;revision=r.revision;ready=true;$('login').hidden=true;status('● Синхронизировано');render()}catch(e){$('login').hidden=false;status('Ошибка: '+e.message)}finally{busy=false}}
let tab=0,editing=null,query='';const tabs=['Главная','Люди','Идеи','Покупки','Бюджет'];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const safe=s=>/^https?:\/\//i.test(s||'')?esc(s):'';const money=n=>Number(n||0).toLocaleString('ru-RU')+' ₽';async function save(){busy=true;status('Сохранение…');try{const r=await request('save',{data,revision});revision=r.revision;status('● Сохранено')}catch(e){status('Не сохранено: '+e.message);alert('Изменения не подтверждены. Экспортируйте копию в настройках перед обновлением.')}finally{busy=false;render()}}function edit(id){if(!ready||busy){status("Сначала подключите Google и дождитесь загрузки");return}editing=id;form.reset();let d=data.find(x=>x.id===id);if(d)for(let k of Object.keys(d))if(form.elements.namedItem(k))form.elements.namedItem(k).value=d[k];dlg.showModal()}form.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(form));d.id=editing||crypto.randomUUID();data=data.filter(x=>x.id!==d.id).concat(d);dlg.close();save()};function removeGift(id){if(!ready||busy)return;if(confirm('Удалить подарок?')){data=data.filter(x=>x.id!==id);save()}}function go(i){tab=i;query='';render()}function search(q){query=q;renderList()}function cards(a){return a.map(d=>`<article class="card">${safe(d.photo)?`<img src="${safe(d.photo)}" alt="Фото подарка">`:''}<div class="line"><h3>${esc(d.title)}</h3><b>${money(d.price)}</b></div><small>${esc(d.person||'Без получателя')} · ${esc(d.category||'Без категории')} · ${esc(d.status)}</small><p>${esc(d.occasion)} ${esc(d.date)}</p><p>${esc(d.note)}</p>${safe(d.url)?`<p><a href="${safe(d.url)}" target="_blank" rel="noopener">Открыть магазин</a></p>`:''}<div class="line"><button class="muted" onclick="edit('${esc(d.id).replace(/[^a-zA-Z0-9-]/g,'')}')">Изменить</button><button class="danger" onclick="removeGift('${esc(d.id).replace(/[^a-zA-Z0-9-]/g,'')}')">Удалить</button></div></article>`).join('')||'<div class="card">Пока здесь ничего нет.</div>'}function renderList(){let a=data.filter(d=>Object.values(d).join(' ').toLowerCase().includes(query.toLowerCase()));if(tab===2)a=a.filter(d=>d.status==='Идея');if(tab===3)a=a.filter(d=>['Запланирован','Заказан','Куплен'].includes(d.status));if(tab===1){let groups={};a.forEach(d=>{let k=(d.category||'Без категории')+' / '+(d.person||'Без получателя');(groups[k]??=[]).push(d)});$('list').innerHTML=Object.entries(groups).map(([k,v])=>`<h3>${esc(k)}</h3>${cards(v)}`).join('')||cards([])}else $('list').innerHTML=cards(a)}function render(){ $('nav').innerHTML=tabs.map((t,i)=>`<button class="${i===tab?'active':''}" onclick="go(${i})">${['⌂','♙','☆','▣','₽'][i]}<br>${t}</button>`).join('');let plan=data.reduce((s,d)=>s+Number(d.price||0),0),actual=data.reduce((s,d)=>s+Number(d.actual||0),0);$('view').innerHTML=`<div class="card"><div class="stats"><div><small>План</small><b>${money(plan)}</b></div><div><small>Потрачено</small><b>${money(actual)}</b></div></div><p>${data.filter(d=>['Куплен','Подарен'].includes(d.status)).length} из ${data.length} подарков готовы</p><button style="width:100%" onclick="edit(null)">＋ Добавить подарок</button></div>${tab===4?'<div class="card"><h3>Бюджет по категориям</h3>'+[...new Set(data.map(d=>d.category||'Без категории'))].map(k=>`<p>${esc(k)} — ${money(data.filter(d=>(d.category||'Без категории')===k).reduce((s,d)=>s+Number(d.price||0),0))}</p>`).join('')+'</div>':''}<div class="line"><h2>${tabs[tab]}</h2></div><input placeholder="Поиск подарков и людей" oninput="search(this.value)" value="${esc(query)}"><div id="list"></div>`;renderList()}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='gifts-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restore(el){if(!ready||busy)return;try{let a=JSON.parse(await el.files[0].text());if(!Array.isArray(a)||!a.every(d=>d&&typeof d.title==='string'))throw Error();if(confirm('Заменить текущий список данными из копии?')){data=a.map((d,i)=>({...d,id:Date.now().toString(36)+i}));save()}}catch{alert('Не удалось прочитать копию')}}render();load();if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});</script></html>
